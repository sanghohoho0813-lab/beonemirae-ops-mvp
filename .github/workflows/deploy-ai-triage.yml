# AI 요청 분석 서버 함수(ai-triage)를 Supabase 에 배포합니다 — GitHub 화면에서 버튼 한 번.
#
#  처음 한 번: 저장소 Settings → Secrets and variables → Actions 에
#    SUPABASE_ACCESS_TOKEN  (필수) Supabase 대시보드 → Account → Access Tokens 에서 발급
#    AI_API_KEY             (선택) 넣어 두면 배포 때 Supabase 함수 Secret 으로도 등록합니다.
#                           Supabase 대시보드 Edge Functions → Secrets 에 직접 넣었다면 비워 두세요.
#  실행: Actions 탭 → 「AI 함수 배포 (ai-triage)」 → Run workflow
#
#  ⚠ 키는 GitHub · Supabase Secret 에만 둡니다. 저장소 파일 · 화면(VITE_*)에 넣지 않습니다.
name: AI 함수 배포 (ai-triage)

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase 프로젝트 ref (대시보드 주소 /project/<ref>)
        required: true
        default: pyjdrubmfyyyuscppcza

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      PROJECT_REF: ${{ inputs.project_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 토큰 확인
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN 이 GitHub Secret 에 없습니다 — 파일 맨 위 안내대로 등록하세요"
            exit 1
          fi
      - name: AI 키 등록 (GitHub Secret 에 있을 때만)
        if: env.AI_API_KEY != ''
        run: supabase secrets set --project-ref "$PROJECT_REF" AI_API_KEY="$AI_API_KEY"
      - name: 함수 배포
        run: supabase functions deploy ai-triage --project-ref "$PROJECT_REF"
      - name: 등록된 Secret 이름 확인 (값은 보이지 않음)
        run: supabase secrets list --project-ref "$PROJECT_REF" | grep -E "AI_API_KEY|NAME" || echo "::warning::AI_API_KEY 가 아직 없습니다 — Supabase 대시보드 Edge Functions → Secrets 에 등록하세요"
