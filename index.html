<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1a2e" />
    <meta
      name="description"
      content="주식회사 비원미래는 서울·경기권 병원, 요양병원, 의원, 요양시설을 대상으로 의료폐기물 수거·운반, 의료기관 폐기물 운영관리, 자재공급, 수거이력 관리를 수행하는 전문기업입니다."
    />
    <meta
      name="keywords"
      content="비원미래, 의료폐기물, 의료폐기물 수거, 의료폐기물 운반, 병원 폐기물, 요양병원 폐기물, 남양주 의료폐기물, 서울 경기 의료폐기물"
    />

    <!-- PWA: 설치형 앱 설정 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="비원미래" />
    <!--
      Pretendard 웹폰트 — 저장소 안(/fonts) 에서 받습니다 (0099).
      가변 서브셋이라 쓰는 글자 범위 파일만 받고, font-display: swap 이라
      받는 동안에도 시스템 글꼴로 먼저 그려 렌더링이 멈추지 않습니다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!--  0099 — 글꼴을 저장소 안(/fonts)에 둡니다.
          바깥 CDN 에서 받으면 병원 내부망·지하처럼 바깥이 막힌 곳에서
          대체 글꼴로 그려져 간격·넘침이 달라집니다(0094 에서 실측).
          가변(variable) 서브셋이라 쓰는 글자 범위 파일만 받습니다. -->
    <link rel="stylesheet" href="/fonts/pretendard.css" />
    <title>주식회사 비원미래 | 서울·경기 의료폐기물 수거·운반</title>

    <!--
      SEO / 소셜 공유 태그
      TODO: 실제 도메인 연결 후 아래 canonical / og:url / og:image / JSON-LD url 의
            https://www.beonemirae.co.kr 부분을 실제 배포 도메인으로 수정할 것.
            (현재 홈페이지 경로는 /company 기준)
    -->
    <link rel="canonical" href="https://www.beonemirae.co.kr/company" />
    <meta property="og:title" content="주식회사 비원미래 | 서울·경기 의료폐기물 수거·운반" />
    <meta
      property="og:description"
      content="서울·경기권 병원·요양병원·의원·요양시설 대상 의료폐기물 수거·운반, 의료기관 폐기물 운영관리, 자재공급, 수거이력 관리 전문기업."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.beonemirae.co.kr/company" />
    <meta property="og:image" content="https://www.beonemirae.co.kr/company/medical-campus-wide-pickup.webp" />
    <meta property="og:site_name" content="주식회사 비원미래" />
    <meta property="og:locale" content="ko_KR" />

    <!-- 구조화 데이터 (Organization) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "주식회사 비원미래",
        "alternateName": "BEONE MIRAE CO.",
        "url": "https://www.beonemirae.co.kr/company",
        "description": "의료폐기물 수거·운반 및 의료기관 폐기물 운영관리 전문기업",
        "areaServed": "서울·경기권",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "오남읍 양지로 47-35, 바동 1층",
          "addressLocality": "남양주시",
          "addressRegion": "경기도",
          "addressCountry": "KR"
        }
      }
    </script>
  </head>
  <body>
    <!--
      화면 색 (0081) — React 가 뜨기 **전에** 정합니다.
      이걸 React 안에서만 하면, 첫 그림은 기본색으로 그려졌다가 곧바로
      고른 색으로 튑니다. 켤 때마다 화면이 한 번 번쩍이는 셈입니다.
      값이 없거나 모르는 이름이면 아무것도 하지 않습니다 — 기본색입니다.
      (실제 색 값은 CSS 안에 있습니다. 여기서는 이름표만 붙입니다.)
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('beonemirae-ops:theme')
          if (t && /^[a-z-]{3,32}$/.test(t)) document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          /* 사생활 보호 모드 등에서 저장소를 못 읽어도 그냥 기본색으로 갑니다 */
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
